<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="./js/app.js" type="module"></script>
    <title>Quadro Acadêmico — Tarefas de projetos</title>
  </head>
  <body>
    <header>
      <h1>Quadro Acadêmico</h1>
    </header>
    <main>
      <form>
        <h2>Busca e filtros</h2>
        <label for="busca-titulo">Buscar por título</label>
        <input type="search" id="busca-titulo" />
        <label for="filtro-status">Filtrar por status</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="a-fazer">A fazer</option>
          <option value="em-andamento">Em andamento</option>
          <option value="em-revisao">Em revisão</option>
          <option value="concluida">Concluída</option>
        </select>
        <fieldset>
          <legend>Prioridade</legend>

          <input
            type="radio"
            name="prioridade"
            id="prioridade-baixa"
            value="baixa"
          />
          <label for="prioridade-baixa">Baixa</label>
          <input
            type="radio"
            name="prioridade"
            id="prioridade-media"
            value="media"
          />
          <label for="prioridade-media">Média</label>
          <input
            type="radio"
            name="prioridade"
            id="prioridade-alta"
            value="alta"
          />
          <label for="prioridade-alta">Alta</label>
        </fieldset>
      </form>
      <p data-estado role="status" aria-live="polite"></p>
      <div class="quadro">
        <section aria-labelledby="status-a-fazer" data-status="a-fazer">
          <h2 id="status-a-fazer">A fazer</h2>
          <ul data-lista-status="a-fazer"></ul>
        </section>
        <section
          aria-labelledby="status-em-andamento"
          data-status="em-andamento"
        >
          <h2 id="status-em-andamento">Em andamento</h2>
          <ul data-lista-status="em-andamento"></ul>
        </section>
        <section aria-labelledby="status-em-revisao" data-status="em-revisao">
          <h2 id="status-em-revisao">Em revisão</h2>
          <ul data-lista-status="em-revisao"></ul>
        </section>
        <section aria-labelledby="status-concluida" data-status="concluida">
          <h2 id="status-concluida">Concluída</h2>
          <ul data-lista-status="concluida"></ul>
        </section>
      </div>
    </main>
    <footer>
      <p>Línnek Araújo - Desenvolvimento FrontEnd, 2026.2</p>
    </footer>
  </body>
</html>
